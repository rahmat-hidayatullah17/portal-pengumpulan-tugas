<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Google Drive</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0ff;background:#0b1222}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#23396a 0%,transparent 40%),#0b1222}.wrap{max-width:1050px;margin:auto;padding:70px 22px}header{margin-bottom:35px}.eyebrow{color:#9fb9ff;letter-spacing:.17em;text-transform:uppercase;font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,52px);margin:12px 0}p{color:#aab8d2;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{padding:26px;border:1px solid #33415e;border-radius:20px;background:#17243b;box-shadow:0 14px 35px #0002}.icon{font-size:35px}h2{font-size:22px;margin:20px 0 6px}.card p{margin:0 0 26px;font-size:14px}.btn{display:inline-flex;align-items:center;justify-content:center;background:#85aaff;color:#09172e;padding:13px 19px;border-radius:11px;font-weight:800;text-decoration:none}.btn:hover{background:#b5cbff}.foot{margin-top:35px;font-size:13px}@media(max-width:650px){.wrap{padding:44px 18px}.grid{grid-template-columns:1fr}.card{padding:22px}}
</style></head><body><main class="wrap"><header><div class="eyebrow">Pusat Akses Dokumen</div><h1>Portal Google Drive</h1><p>Semua folder penting dalam satu tempat. Pilih folder untuk membuka isinya di Google Drive.</p></header><section class="grid" id="folders"></section><p class="foot">Catatan: akses file mengikuti pengaturan izin masing-masing folder Google Drive.</p></main><script>
const folders=[
{name:'Metode Penelitian Kualitatif',url:'https://drive.google.com/drive/folders/1geruIj_7MnAxzO5YMy7g6lji-QH-QkCY'},
{name:'Makalah Pengantar Statistika Matematika',url:'https://drive.google.com/drive/folders/1W4qm-3pNzyts_Y_R-NSMgkpHDCVEZvXb'},
{name:'Aljabar Linear Lanjut',url:'https://drive.google.com/drive/folders/1eD_aOg9CBMoWbWcDj3ddISvt2_WfMwkw?usp=sharing'},
{name:'Kalkulus Peubah Banyak',url:'https://drive.google.com/drive/folders/1BANNQrMbe47NEFv_31XLViU49RS1kf5M'}
];document.getElementById('folders').innerHTML=folders.map((f,i)=>`<article class="card"><div class="icon">📁</div><h2>${f.name}</h2><p>Folder Google Drive ${i+1} · Klik tombol di bawah untuk melihat dokumen.</p><a class="btn" href="${f.url}" target="_blank" rel="noopener noreferrer">Buka Google Drive ↗</a></article>`).join('');
</script></body></html>
